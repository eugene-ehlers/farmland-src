<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Farmland — South Africa</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="map"></div>
  <header class="topbar">
    <div class="brand">
      <strong>Farmland</strong>
      <span class="sub">South Africa and neighbours</span>
    </div>
    <form id="search-form" autocomplete="off">
      <input id="search" type="search" placeholder="Farm name, parcel id, or lat,lng" />
      <button type="submit">Find</button>
    </form>
  </header>
  <div class="banner">
    Southern Africa basemap. Demo farm portions exist only in Limpopo for now — CSG extract not loaded.
    Next: known data versus gaps. No official SG/LPI codes.
  </div>
  <aside id="dossier" class="dossier" hidden>
    <button class="close" id="close-dossier" aria-label="Close">×</button>
    <div id="dossier-body"></div>
  </aside>
  <footer class="legal">
    Farmland is indicative land intelligence. It is not a title deed, survey, or soil test.
  </footer>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
