<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Farmland — South Africa</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="map"></div>
  <header class="topbar">
    <div class="brand">
      <strong>Farmland</strong>
      <span class="sub">South Africa and neighbours</span>
    </div>
    <form id="search-form" autocomplete="off">
      <input id="search" type="search" placeholder="Town, city, or lat,lng" />
      <button type="submit">Find</button>
    </form>
  </header>
  <div class="banner" id="banner">
    Zoom in to see analysis cells (~1 km). Every cell has a stable id. Not a title deed.
    Weather and soil columns are still empty.
  </div>
  <aside id="dossier" class="dossier" hidden>
    <button class="close" id="close-dossier" aria-label="Close">×</button>
    <div id="dossier-body"></div>
  </aside>
  <footer class="legal">
    Rows are coordinate-grid cells so the whole country has coverage. They are not Surveyor-General farm portions.
  </footer>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
